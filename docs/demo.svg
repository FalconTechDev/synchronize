    <text class="line l5" x="22" y="157"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn status my-notes</tspan></text>
    <text class="line l6" x="22" y="176" fill="#c9d1d9">  watcher:  running (pid 26676), started 2 h ago, checked 1 min ago</text>
    <text class="line l7" x="22" y="195" fill="#c9d1d9">            next look at my-notes in 9 min</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9">my-notes  (C:\Users\me\my-notes)</text>
