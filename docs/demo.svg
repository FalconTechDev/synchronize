  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">syn — two machines, one history</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn auto on</tspan></text>
    <text class="line l1" x="22" y="81" fill="#c9d1d9">  login      on    sync once when you log in</text>
    <text class="line l2" x="22" y="100" fill="#c9d1d9">  watch      on    then keep syncing every 10 minutes</text>
    <text class="line l3" x="22" y="119" fill="#c9d1d9">  shutdown   on    publish before the machine goes down, and hold it until done</text>
