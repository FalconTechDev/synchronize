<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 447" width="760" height="447" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Switching syn on, asking what it is doing, then a push arriving and the bot restarting">
  <title>syn — two machines, one history</title>

  <style>
