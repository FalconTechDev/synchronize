<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Switching syn on, asking what it is doing, then a push arriving and the bot restarting">
  <title>syn — two machines, one history</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13.5px }
    /* Visible by default; the keyframes do the hiding. A renderer that does
       not animate then shows the finished screen, not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,11.5%{opacity:0} 12.5%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,15.4%{opacity:0} 16.4%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,19.4%{opacity:0} 20.4%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,23.3%{opacity:0} 24.3%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,25.3%{opacity:0} 26.3%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,34.7%{opacity:0} 35.7%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,38.7%{opacity:0} 39.7%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,42.6%{opacity:0} 43.6%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,44.6%{opacity:0} 45.6%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,48.5%{opacity:0} 49.5%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,52.5%{opacity:0} 53.5%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,56.4%{opacity:0} 57.4%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,60.4%{opacity:0} 61.4%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,64.3%{opacity:0} 65.3%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,66.3%{opacity:0} 67.3%,95%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s linear infinite }
    @keyframes k16 { 0%,70.2%{opacity:0} 71.2%,95%{opacity:1} 100%{opacity:0} }
    .l17 { animation: k17 16s linear infinite }
    @keyframes k17 { 0%,74.2%{opacity:0} 75.2%,95%{opacity:1} 100%{opacity:0} }
    .l18 { animation: k18 16s linear infinite }
    @keyframes k18 { 0%,78.1%{opacity:0} 79.1%,95%{opacity:1} 100%{opacity:0} }
    .l19 { animation: k19 16s linear infinite }
    @keyframes k19 { 0%,82.1%{opacity:0} 83.1%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="466" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="465" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">syn — two machines, one history</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn auto on</tspan></text>
    <text class="line l1" x="22" y="81" fill="#3fb950">  login     on   sync once when you log in</text>
    <text class="line l2" x="22" y="100" fill="#3fb950">  watch     on   then keep syncing every 10 minutes</text>
    <text class="line l3" x="22" y="119" fill="#3fb950">  shutdown  on   publish before the machine goes down</text>
    <text class="line l4" x="22" y="138"> </text>
    <text class="line l5" x="22" y="157"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn status all</tspan></text>
    <text class="line l6" x="22" y="176" fill="#58a6ff">  watcher:  running (pid 26676), checked 1 min ago</text>
    <text class="line l7" x="22" y="195" fill="#8b949e">            next look at my-bot in 9 min</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9">my-bot  (/srv/my-bot)</text>
    <text class="line l10" x="22" y="252" fill="#8b949e">  branch:    main -&gt; origin/main</text>
    <text class="line l11" x="22" y="271" fill="#3fb950">  local:     clean</text>
    <text class="line l12" x="22" y="290" fill="#8b949e">  vs remote: 0 ahead, 0 behind</text>
    <text class="line l13" x="22" y="309" fill="#8b949e">  last sync: 1 min ago</text>
    <text class="line l14" x="22" y="328"> </text>
    <text class="line l15" x="22" y="347" fill="#8b949e">... bot.py pushed from the laptop ...</text>
    <text class="line l16" x="22" y="366" fill="#58a6ff">my-bot: pulled 1 commit from origin/main</text>
    <text class="line l17" x="22" y="385" fill="#8b949e">                 modified  bot.py</text>
    <text class="line l18" x="22" y="404" fill="#58a6ff">my-bot: the code changed - restarting python bot.py</text>
    <text class="line l19" x="22" y="423" fill="#3fb950">my-bot | bot v2 running</text>
  </g>
</svg>
