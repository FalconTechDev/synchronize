<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 440" width="760" height="440" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="A terminal: syn auto on, syn status all, then the watcher picking up a push and restarting the bot">
  <title>synchronize — a minute with it</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    .t      { font-size: 14px; white-space: pre }
    .dim    { fill: #8b949e }
    .fg     { fill: #c9d1d9 }
    .pr     { fill: #a371f7; font-weight: 700 }
    .ok     { fill: #3fb950 }
    .info   { fill: #58a6ff }

    /* Each line waits its turn and then stays, so the picture builds up the
       way the terminal does. The whole thing loops: a README should show the
       tool running, not a still of a finished run. */
    /* Visible by default on purpose: a renderer that does not animate - a
       static preview, an image proxy, a PDF of the page - then shows the
       finished terminal instead of an empty black box. The keyframes start
       at nothing and build up, so where animation does run it looks right. */
    .line { opacity: 1 }
    .l1  { animation: k1  16s infinite } @keyframes k1  { 0%,1%{opacity:0}  2%,94%{opacity:1} 100%{opacity:0} }
    .l2  { animation: k2  16s infinite } @keyframes k2  { 0%,5%{opacity:0}  6%,94%{opacity:1} 100%{opacity:0} }
    .l3  { animation: k3  16s infinite } @keyframes k3  { 0%,7%{opacity:0}  8%,94%{opacity:1} 100%{opacity:0} }
    .l4  { animation: k4  16s infinite } @keyframes k4  { 0%,9%{opacity:0}  10%,94%{opacity:1} 100%{opacity:0} }
    .l5  { animation: k5  16s infinite } @keyframes k5  { 0%,14%{opacity:0} 15%,94%{opacity:1} 100%{opacity:0} }
    .l6  { animation: k6  16s infinite } @keyframes k6  { 0%,22%{opacity:0} 23%,94%{opacity:1} 100%{opacity:0} }
    .l7  { animation: k7  16s infinite } @keyframes k7  { 0%,25%{opacity:0} 26%,94%{opacity:1} 100%{opacity:0} }
    .l8  { animation: k8  16s infinite } @keyframes k8  { 0%,28%{opacity:0} 29%,94%{opacity:1} 100%{opacity:0} }
    .l9  { animation: k9  16s infinite } @keyframes k9  { 0%,30%{opacity:0} 31%,94%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s infinite } @keyframes k10 { 0%,32%{opacity:0} 33%,94%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s infinite } @keyframes k11 { 0%,34%{opacity:0} 35%,94%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s infinite } @keyframes k12 { 0%,36%{opacity:0} 37%,94%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s infinite } @keyframes k13 { 0%,46%{opacity:0} 47%,94%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s infinite } @keyframes k14 { 0%,56%{opacity:0} 57%,94%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s infinite } @keyframes k15 { 0%,59%{opacity:0} 60%,94%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s infinite } @keyframes k16 { 0%,66%{opacity:0} 67%,94%{opacity:1} 100%{opacity:0} }
    .l17 { animation: k17 16s infinite } @keyframes k17 { 0%,74%{opacity:0} 75%,94%{opacity:1} 100%{opacity:0} }
    .l18 { animation: k18 16s infinite } @keyframes k18 { 0%,78%{opacity:0} 79%,94%{opacity:1} 100%{opacity:0} }

    .cursor { fill: #c9d1d9; animation: blink 1.1s steps(1) infinite }
    @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }

    /* Anyone whose system asks for less motion gets the finished frame. */
    @media (prefers-reduced-motion: reduce) {
      .line  { animation: none; opacity: 1 }
      .cursor { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="440" rx="10"/>
  <rect class="chrome" width="760" height="34" rx="10"/>
  <rect class="chrome" y="24" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="439" rx="10"/>

  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="17" r="5.5" fill="#28c840"/>
  <text class="t dim" x="380" y="22" text-anchor="middle">syn — two machines, one history</text>

  <g class="t">
    <!-- Switch it on. -->
    <text class="line l1" x="22" y="66"><tspan class="pr">$</tspan><tspan class="fg" dx="8">syn auto on</tspan></text>
    <text class="line l2 ok" x="22" y="88">  login     on   sync once when you log in</text>
    <text class="line l3 ok" x="22" y="106">  watch     on   then keep syncing every 10 minutes</text>
    <text class="line l4 ok" x="22" y="124">  shutdown  on   publish before the machine goes down</text>

    <!-- Ask what is going on. -->
    <text class="line l5" x="22" y="156"><tspan class="pr">$</tspan><tspan class="fg" dx="8">syn status all</tspan></text>
    <text class="line l6 info" x="22" y="178">  watcher:  running (pid 26676), checked 1 min ago</text>
    <text class="line l7 dim"  x="22" y="196">            next look at my-bot in 9 min</text>
    <text class="line l8 fg"   x="22" y="222">my-bot  <tspan class="dim">(/srv/my-bot)</tspan></text>
    <text class="line l9 dim"  x="22" y="240">  branch:   main -&gt; origin/main</text>
    <text class="line l10 ok"  x="22" y="258">  local:    clean</text>
    <text class="line l11 dim" x="22" y="276">  vs remote: 0 ahead, 0 behind</text>
    <text class="line l12 dim" x="22" y="294">  last sync: 1 min ago</text>

    <!-- You push from the laptop. The watcher picks it up on its own. -->
    <text class="line l13 dim" x="22" y="326">… bot.py pushed from the laptop …</text>
    <text class="line l14 info" x="22" y="352">my-bot: pulled 1 commit from origin/main</text>
    <text class="line l15 dim"  x="22" y="370">                 modified  bot.py</text>
    <text class="line l16 info" x="22" y="388">my-bot: the code changed - restarting python bot.py</text>
    <text class="line l17 ok"   x="22" y="406">my-bot | bot v2 running</text>

    <!-- Left waiting, so it reads as a live session rather than a transcript. -->
    <g class="line l18">
      <text x="22" y="428"><tspan class="pr">$</tspan></text>
      <rect class="cursor" x="38" y="417" width="8" height="15"/>
    </g>
  </g>
</svg>
