<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="restart runs a command and waits for it; app supervises a program that never returns">
  <title>restart waits · app supervises</title>

  <style>
    .card  { fill: #0d1117 }
    .edge  { fill: none; stroke: #30363d; stroke-width: 1 }
    .pane  { fill: #161b22; stroke: #30363d; stroke-width: 1 }
    .h     { font-size: 14px; fill: #c9d1d9; font-weight: 600 }
    .sub   { font-size: 11px; fill: #8b949e }
    .mono  { font-family: ui-monospace, Consolas, monospace; font-size: 12px; fill: #8b949e }
    .rail  { stroke: #30363d; stroke-width: 2 }

    /* The one distinction people get wrong. On the left a command starts,
       runs, and finishes - so syn can wait for it. On the right a program
       starts and keeps going, which is why waiting for it would hang the
       sync until the hook timeout killed the bot. */
    .runL { animation: grow 6s ease-in-out infinite }
    @keyframes grow { 0%,8%{width:0;opacity:0} 12%{opacity:1} 46%{width:132px;opacity:1} 58%{width:132px;opacity:1} 62%,100%{width:132px;opacity:0} }
    .doneL { animation: tick 6s ease-in-out infinite }
    @keyframes tick { 0%,46%{opacity:0} 50%,58%{opacity:1} 62%,100%{opacity:0} }

    .runR { animation: forever 6s linear infinite }
    @keyframes forever { 0%{transform:translateX(0)} 100%{transform:translateX(44px)} }
    .beat { animation: bump 1.4s ease-in-out infinite }
    @keyframes bump { 0%,100%{opacity:.4} 50%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .runL { animation: none; width: 132px; opacity: 1 }
      .doneL { animation: none; opacity: 1 }
      .runR, .beat { animation: none; opacity: 1 }
    }
  </style>

  <rect class="card" width="760" height="270" rx="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="269" rx="10"/>

  <text class="sub" x="380" y="32" text-anchor="middle">both run something after a pull — the difference is whether it ever comes back</text>

  <!-- restart -->
  <rect class="pane" x="30" y="56" width="334" height="156" rx="8"/>
  <text class="h"    x="54" y="86">syn restart</text>
  <text class="sub"  x="54" y="106">hands over to a service manager you already have</text>
  <text class="mono" x="54" y="128">systemctl restart my-bot</text>

  <line class="rail" x1="54" y1="158" x2="186" y2="158"/>
  <rect class="runL" x="54" y="154" height="8" rx="4" fill="#58a6ff"/>
  <g class="doneL">
    <circle cx="198" cy="158" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
    <path d="M 193 158 l 4 5 l 8 -10" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="sub" x="54" y="190">it finishes — so syn waits for it, and knows whether it worked</text>

  <!-- app -->
  <rect class="pane" x="396" y="56" width="334" height="156" rx="8"/>
  <text class="h"    x="420" y="86">syn app</text>
  <text class="sub"  x="420" y="106">syn is the service manager</text>
  <text class="mono" x="420" y="128">python bot.py</text>

  <line class="rail" x1="420" y1="158" x2="706" y2="158"/>
  <g class="runR">
    <circle class="beat" cx="432" cy="158" r="5" fill="#3fb950"/>
    <circle class="beat" cx="476" cy="158" r="5" fill="#3fb950"/>
    <circle class="beat" cx="520" cy="158" r="5" fill="#3fb950"/>
    <circle class="beat" cx="564" cy="158" r="5" fill="#3fb950"/>
    <circle class="beat" cx="608" cy="158" r="5" fill="#3fb950"/>
    <circle class="beat" cx="652" cy="158" r="5" fill="#3fb950"/>
  </g>
  <text class="sub" x="420" y="190">it never finishes — so syn keeps it alive instead of waiting</text>

  <text class="sub" x="380" y="242" text-anchor="middle">put a program that never returns in a hook and the timeout kills it after five minutes</text>
</svg>
