<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="The three switches, the repositories they cover, and a pause">
  <title>automatic syncing</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13px }
    /* Visible by default; the keyframes do the hiding, so a renderer that
       does not animate shows the finished screen and not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,13.0%{opacity:0} 14.0%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,17.6%{opacity:0} 18.6%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,22.2%{opacity:0} 23.2%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,26.8%{opacity:0} 27.8%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,29.1%{opacity:0} 30.1%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,33.7%{opacity:0} 34.7%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,38.3%{opacity:0} 39.3%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,42.9%{opacity:0} 43.9%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,45.1%{opacity:0} 46.1%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,49.7%{opacity:0} 50.7%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,54.3%{opacity:0} 55.3%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,58.9%{opacity:0} 59.9%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,63.5%{opacity:0} 64.5%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,65.8%{opacity:0} 66.8%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,76.8%{opacity:0} 77.8%,95%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s linear infinite }
    @keyframes k16 { 0%,81.4%{opacity:0} 82.4%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="409" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="408" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">automatic syncing</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn auto</tspan></text>
    <text class="line l1" x="22" y="81" fill="#c9d1d9">  login      on    sync once when you log in</text>
    <text class="line l2" x="22" y="100" fill="#c9d1d9">  watch      on    then keep syncing every 10 minutes</text>
    <text class="line l3" x="22" y="119" fill="#c9d1d9">  shutdown   on    publish before the machine goes down, and hold it until done</text>
    <text class="line l4" x="22" y="138"> </text>
    <text class="line l5" x="22" y="157" fill="#c9d1d9">  Repositories</text>
    <text class="line l6" x="22" y="176" fill="#c9d1d9">    my-notes   every 10 minutes</text>
    <text class="line l7" x="22" y="195" fill="#c9d1d9">    my-bot     every 1 minute</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9">  All three:      syn auto on|off</text>
    <text class="line l10" x="22" y="252" fill="#c9d1d9">  One at a time:  syn auto login|watch|shutdown on|off</text>
    <text class="line l11" x="22" y="271" fill="#c9d1d9">  How often:      syn auto watch 30m</text>
    <text class="line l12" x="22" y="290" fill="#c9d1d9">  One repo:       syn auto &lt;repo&gt; on|off</text>
    <text class="line l13" x="22" y="309"> </text>
    <text class="line l14" x="22" y="328"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn pause my-bot 2h</tspan></text>
    <text class="line l15" x="22" y="347" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:09 [INFO]</tspan><tspan dx="7">my-bot: left out of automatic syncing until 09:42 on 19 Oct</tspan></text>
    <text class="line l16" x="22" y="366" fill="#c9d1d9">  Commands you type yourself still work as normal.</text>
  </g>
</svg>
