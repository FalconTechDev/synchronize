<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 390" width="788" height="390" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Deploy target, CI gate, and the program syn keeps running">
  <title>a server, set up once</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13px }
    /* Visible by default; the keyframes do the hiding, so a renderer that
       does not animate shows the finished screen and not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,12.0%{opacity:0} 13.0%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,16.2%{opacity:0} 17.2%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,20.4%{opacity:0} 21.4%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,22.5%{opacity:0} 23.5%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,32.5%{opacity:0} 33.5%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,36.7%{opacity:0} 37.7%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,38.8%{opacity:0} 39.8%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,48.8%{opacity:0} 49.8%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,53.0%{opacity:0} 54.0%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,57.2%{opacity:0} 58.2%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,61.3%{opacity:0} 62.3%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,65.5%{opacity:0} 66.5%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,67.6%{opacity:0} 68.6%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,77.6%{opacity:0} 78.6%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,81.8%{opacity:0} 82.8%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="788" height="390" rx="10"/>
  <rect class="chrome" width="788" height="32" rx="10"/>
  <rect class="chrome" y="22" width="788" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="787" height="389" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="394" y="21" text-anchor="middle" fill="#8b949e" font-size="12">a server, set up once</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn deploy my-bot on</tspan></text>
    <text class="line l1" x="22" y="81" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:09 [INFO]</tspan><tspan dx="7">my-bot: deploy target - syncing brings changes down and sends nothing up</tspan></text>
    <text class="line l2" x="22" y="100" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:12 [INFO]</tspan><tspan dx="7">       anything written there stays on this machine, uncommitted</tspan></text>
    <text class="line l3" x="22" y="119"> </text>
    <text class="line l4" x="22" y="138"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn set my-bot require_checks on</tspan></text>
    <text class="line l5" x="22" y="157" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:15 [INFO]</tspan><tspan dx="7">my-bot.require_checks = "on"</tspan></text>
    <text class="line l6" x="22" y="176"> </text>
    <text class="line l7" x="22" y="195"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn app my-bot -- python bot.py</tspan></text>
    <text class="line l8" x="22" y="214" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:18 [INFO]</tspan><tspan dx="7">my-bot: runs python bot.py</tspan></text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:21 [INFO]</tspan><tspan dx="7">       restarted whenever an update arrives</tspan></text>
    <text class="line l10" x="22" y="252" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:24 [INFO]</tspan><tspan dx="7">       the watcher starts it:  syn watch my-bot</tspan></text>
    <text class="line l11" x="22" y="271" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:27 [INFO]</tspan><tspan dx="7">       or try it here first:   syn app my-bot start</tspan></text>
    <text class="line l12" x="22" y="290"> </text>
    <text class="line l13" x="22" y="309"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">sudo syn service install --as deploy</tspan></text>
    <text class="line l14" x="22" y="328" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:30 [INFO]</tspan><tspan dx="7">wrote /etc/systemd/system/synchronize.service</tspan></text>
    <text class="line l15" x="22" y="347" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:33 [INFO]</tspan><tspan dx="7">synchronize.service is running as deploy, and will come back after a reboot</tspan></text>
  </g>
</svg>
