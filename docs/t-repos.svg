<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Registering a clone you have, cloning a new one, listing and removing">
  <title>tracking repositories</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13.5px }
    /* Visible by default; the keyframes do the hiding. A renderer that does
       not animate then shows the finished screen, not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,11.2%{opacity:0} 12.2%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,15.0%{opacity:0} 16.0%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,16.9%{opacity:0} 17.9%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,26.1%{opacity:0} 27.1%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,29.9%{opacity:0} 30.9%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,31.8%{opacity:0} 32.8%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,40.9%{opacity:0} 41.9%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,44.8%{opacity:0} 45.8%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,46.7%{opacity:0} 47.7%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,55.8%{opacity:0} 56.8%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,59.7%{opacity:0} 60.7%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,63.5%{opacity:0} 64.5%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,67.3%{opacity:0} 68.3%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,71.1%{opacity:0} 72.1%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,73.0%{opacity:0} 74.0%,95%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s linear infinite }
    @keyframes k16 { 0%,82.2%{opacity:0} 83.2%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="409" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="408" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">tracking repositories</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn init</tspan></text>
    <text class="line l1" x="22" y="81" fill="#3fb950">  registered "notes" -&gt; origin (github.com/me/notes)</text>
    <text class="line l2" x="22" y="100"> </text>
    <text class="line l3" x="22" y="119"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn repo add me/my-bot --path /srv/my-bot</tspan></text>
    <text class="line l4" x="22" y="138" fill="#3fb950">  my-bot: tracking origin/main</text>
    <text class="line l5" x="22" y="157"> </text>
    <text class="line l6" x="22" y="176"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn repo add https://gitlab.com/group/thing.git</tspan></text>
    <text class="line l7" x="22" y="195" fill="#8b949e">  any git remote works - git handles the credentials</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn ls</tspan></text>
    <text class="line l10" x="22" y="252" fill="#c9d1d9">  notes     every 10 minutes   origin/main</text>
    <text class="line l11" x="22" y="271" fill="#8b949e">            C:\Users\me\notes</text>
    <text class="line l12" x="22" y="290" fill="#c9d1d9">  my-bot    every 1 minute     origin/main</text>
    <text class="line l13" x="22" y="309" fill="#8b949e">            /srv/my-bot</text>
    <text class="line l14" x="22" y="328"> </text>
    <text class="line l15" x="22" y="347"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn remove notes</tspan></text>
    <text class="line l16" x="22" y="366" fill="#8b949e">  stopped tracking "notes" (files untouched)</text>
  </g>
</svg>
