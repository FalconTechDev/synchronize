<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Syncing only one folder, and keeping a local file out of automatic commits">
  <title>part of a repository</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13px }
    /* Visible by default; the keyframes do the hiding, so a renderer that
       does not animate shows the finished screen and not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,11.8%{opacity:0} 12.8%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,15.9%{opacity:0} 16.9%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,17.9%{opacity:0} 18.9%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,27.7%{opacity:0} 28.7%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,31.8%{opacity:0} 32.8%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,35.8%{opacity:0} 36.8%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,39.9%{opacity:0} 40.9%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,44.0%{opacity:0} 45.0%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,46.0%{opacity:0} 47.0%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,50.1%{opacity:0} 51.1%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,54.2%{opacity:0} 55.2%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,56.2%{opacity:0} 57.2%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,66.0%{opacity:0} 67.0%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,70.1%{opacity:0} 71.1%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,72.1%{opacity:0} 73.1%,95%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s linear infinite }
    @keyframes k16 { 0%,81.9%{opacity:0} 82.9%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="409" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="408" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">part of a repository</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn files include big-repo "src/**"</tspan></text>
    <text class="line l1" x="22" y="81" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:09 [INFO]</tspan><tspan dx="7">big-repo: include pattern "src/**" added</tspan></text>
    <text class="line l2" x="22" y="100"> </text>
    <text class="line l3" x="22" y="119"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn files big-repo</tspan></text>
    <text class="line l4" x="22" y="138" fill="#c9d1d9">big-repo:</text>
    <text class="line l5" x="22" y="157" fill="#c9d1d9">  include:</text>
    <text class="line l6" x="22" y="176" fill="#c9d1d9">    src/**</text>
    <text class="line l7" x="22" y="195" fill="#c9d1d9">  exclude:</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9">  active sparse-checkout:</text>
    <text class="line l10" x="22" y="252" fill="#c9d1d9">  src/**</text>
    <text class="line l11" x="22" y="271"> </text>
    <text class="line l12" x="22" y="290"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn ignore my-bot "*.env"</tspan></text>
    <text class="line l13" x="22" y="309" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:12 [INFO]</tspan><tspan dx="7">my-bot: *.env held back from automatic commits</tspan></text>
    <text class="line l14" x="22" y="328"> </text>
    <text class="line l15" x="22" y="347"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn files clear big-repo</tspan></text>
    <text class="line l16" x="22" y="366" fill="#c9d1d9"><tspan fill="#8b949e">2026-10-19 07:42:15 [INFO]</tspan><tspan dx="7">big-repo: all file rules cleared (all files will be synced)</tspan></text>
  </g>
</svg>
