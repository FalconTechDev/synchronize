<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 371" width="760" height="371" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="Setting up Telegram alerts and checking they arrive">
  <title>alerts</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13.5px }
    /* Visible by default; the keyframes do the hiding. A renderer that does
       not animate then shows the finished screen, not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,13.4%{opacity:0} 14.4%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,18.1%{opacity:0} 19.1%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,22.9%{opacity:0} 23.9%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,25.3%{opacity:0} 26.3%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,36.6%{opacity:0} 37.6%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,41.4%{opacity:0} 42.4%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,46.1%{opacity:0} 47.1%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,50.9%{opacity:0} 51.9%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,53.3%{opacity:0} 54.3%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,64.6%{opacity:0} 65.6%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,69.4%{opacity:0} 70.4%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,74.1%{opacity:0} 75.1%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,78.9%{opacity:0} 79.9%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,81.3%{opacity:0} 82.3%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="371" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="370" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">alerts</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn config telegram 8012345678:AAE... 123456789</tspan></text>
    <text class="line l1" x="22" y="81" fill="#3fb950">  Telegram alerts will go to chat 123456789</text>
    <text class="line l2" x="22" y="100" fill="#8b949e">         check it works:  syn config test</text>
    <text class="line l3" x="22" y="119"> </text>
    <text class="line l4" x="22" y="138"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn config telegram</tspan></text>
    <text class="line l5" x="22" y="157" fill="#c9d1d9">Telegram alerts go to chat 123456789</text>
    <text class="line l6" x="22" y="176" fill="#8b949e">  sending on:  conflict</text>
    <text class="line l7" x="22" y="195" fill="#8b949e">  switch off:  syn config telegram off</text>
    <text class="line l8" x="22" y="214"> </text>
    <text class="line l9" x="22" y="233"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn config test</tspan></text>
    <text class="line l10" x="22" y="252" fill="#58a6ff">  sending a test alert...</text>
    <text class="line l11" x="22" y="271" fill="#3fb950">  Sent. A desktop notification should have appeared.</text>
    <text class="line l12" x="22" y="290" fill="#8b949e">  Telegram: check chat 123456789.</text>
    <text class="line l13" x="22" y="309"> </text>
    <text class="line l14" x="22" y="328" fill="#8b949e">the token is a password for the bot - it is never printed back</text>
  </g>
</svg>
