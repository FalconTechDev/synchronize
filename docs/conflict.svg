<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="On a conflict: the merge is aborted, a backup branch is taken, syncing stops, and it waits for you">
  <title>What happens on a conflict</title>

  <style>
    .card  { fill: #0d1117 }
    .edge  { fill: none; stroke: #30363d; stroke-width: 1 }
    .step  { fill: #161b22; stroke: #30363d; stroke-width: 1 }
    .label { font-size: 13px; fill: #c9d1d9 }
    .sub   { font-size: 11px; fill: #8b949e }
    .n     { font-size: 12px; fill: #0d1117; font-weight: 700 }
    .arrow { stroke: #30363d; stroke-width: 2; fill: none }

    /* Four steps in order, because the order is the reassurance: it stops
       before it can do damage, and takes a copy before it touches anything. */
    .s1 { animation: on1 8s ease-in-out infinite }
    .s2 { animation: on2 8s ease-in-out infinite }
    .s3 { animation: on3 8s ease-in-out infinite }
    .s4 { animation: on4 8s ease-in-out infinite }
    @keyframes on1 { 0%,4%{opacity:.4} 8%,100%{opacity:1} }
    @keyframes on2 { 0%,22%{opacity:.4} 26%,100%{opacity:1} }
    @keyframes on3 { 0%,42%{opacity:.4} 46%,100%{opacity:1} }
    @keyframes on4 { 0%,62%{opacity:.4} 66%,100%{opacity:1} }

    .halt { animation: pulse 8s ease-in-out infinite }
    @keyframes pulse { 0%,62%{opacity:0} 68%{opacity:1} 80%{opacity:.45} 90%{opacity:1} 100%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .s1,.s2,.s3,.s4,.halt { animation: none; opacity: 1 }
    }
  </style>

  <rect class="card" width="760" height="250" rx="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="249" rx="10"/>

  <text class="sub" x="380" y="32" text-anchor="middle">a conflict is the one thing syn will not decide for you</text>

  <line class="arrow" x1="182" y1="118" x2="206" y2="118"/>
  <line class="arrow" x1="358" y1="118" x2="382" y2="118"/>
  <line class="arrow" x1="534" y1="118" x2="558" y2="118"/>

  <!-- 1 abort -->
  <g class="s1">
    <rect class="step" x="30" y="78" width="152" height="80" rx="8"/>
    <circle cx="52" cy="100" r="9" fill="#f85149"/><text class="n" x="52" y="104" text-anchor="middle">1</text>
    <text class="label" x="70" y="104">aborted</text>
    <text class="sub" x="46" y="128">the moment it goes</text>
    <text class="sub" x="46" y="144">wrong — nothing half</text>
  </g>

  <!-- 2 backup -->
  <g class="s2">
    <rect class="step" x="206" y="78" width="152" height="80" rx="8"/>
    <circle cx="228" cy="100" r="9" fill="#d29922"/><text class="n" x="228" y="104" text-anchor="middle">2</text>
    <text class="label" x="246" y="104">backup branch</text>
    <text class="sub" x="222" y="128">your work is copied</text>
    <text class="sub" x="222" y="144">before anything moves</text>
  </g>

  <!-- 3 tells you -->
  <g class="s3">
    <rect class="step" x="382" y="78" width="152" height="80" rx="8"/>
    <circle cx="404" cy="100" r="9" fill="#58a6ff"/><text class="n" x="404" y="104" text-anchor="middle">3</text>
    <text class="label" x="422" y="104">it tells you</text>
    <text class="sub" x="398" y="128">desktop notice, and</text>
    <text class="sub" x="398" y="144">again daily if ignored</text>
  </g>

  <!-- 4 stops -->
  <g class="s4">
    <rect class="step" x="558" y="78" width="172" height="80" rx="8"/>
    <circle class="halt" cx="580" cy="100" r="9" fill="#f85149"/><text class="n" x="580" y="104" text-anchor="middle">4</text>
    <text class="label" x="598" y="104">syncing stops</text>
    <text class="sub" x="574" y="128">no commit, no push,</text>
    <text class="sub" x="574" y="144">until you say what to do</text>
  </g>

  <text class="sub" x="380" y="198" text-anchor="middle">the markers are already in your files — edit them, then:</text>
  <text x="380" y="222" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#3fb950">syn resolve my-repo</text>
</svg>
