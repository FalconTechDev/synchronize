<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="On a conflict: the merge is aborted, a backup branch is taken, you are told, and syncing stops">
  <title>What happens on a conflict</title>

  <!-- Grid: margin 30 either side, four equal cards of 157 with 24 between.
       30 + 4*157 + 3*24 = 730 = 760 - 30. Nothing here is placed by eye. -->
  <style>
    .card  { fill: #0d1117 }
    .edge  { fill: none; stroke: #30363d; stroke-width: 1 }
    .step  { fill: #161b22; stroke: #30363d; stroke-width: 1 }
    .label { font-size: 13px; fill: #c9d1d9; font-weight: 600 }
    .sub   { font-size: 11px; fill: #8b949e }
    .n     { font-size: 11px; fill: #0d1117; font-weight: 700 }
    .arrow { stroke: #30363d; stroke-width: 2; fill: none }

    /* Four steps in order, because the order is the reassurance: it stops
       before it can do damage, and takes a copy before it touches anything. */
    .s1 { animation: on1 8s ease-in-out infinite }
    .s2 { animation: on2 8s ease-in-out infinite }
    .s3 { animation: on3 8s ease-in-out infinite }
    .s4 { animation: on4 8s ease-in-out infinite }
    @keyframes on1 { 0%,4%{opacity:.35} 8%,100%{opacity:1} }
    @keyframes on2 { 0%,22%{opacity:.35} 26%,100%{opacity:1} }
    @keyframes on3 { 0%,42%{opacity:.35} 46%,100%{opacity:1} }
    @keyframes on4 { 0%,62%{opacity:.35} 66%,100%{opacity:1} }

    .halt { animation: pulse 8s ease-in-out infinite }
    @keyframes pulse { 0%,62%{opacity:1} 70%{opacity:.4} 78%{opacity:1} 86%{opacity:.4} 94%,100%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .s1,.s2,.s3,.s4,.halt { animation: none; opacity: 1 }
    }
  </style>

  <rect class="card" width="760" height="250" rx="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="249" rx="10"/>

  <text class="sub" x="380" y="32" text-anchor="middle">a conflict is the one thing syn will not decide for you</text>

  <line class="arrow" x1="193" y1="118" x2="205" y2="118"/>
  <line class="arrow" x1="374" y1="118" x2="386" y2="118"/>
  <line class="arrow" x1="555" y1="118" x2="567" y2="118"/>

  <g class="s1">
    <rect class="step" x="30" y="78" width="157" height="80" rx="8"/>
    <circle cx="50" cy="98" r="8.5" fill="#f85149"/><text class="n" x="50" y="102" text-anchor="middle">1</text>
    <text class="label" x="67" y="102">aborted</text>
    <text class="sub" x="46" y="126">the moment it goes wrong</text>
    <text class="sub" x="46" y="142">nothing is half-merged</text>
  </g>

  <g class="s2">
    <rect class="step" x="211" y="78" width="157" height="80" rx="8"/>
    <circle cx="231" cy="98" r="8.5" fill="#d29922"/><text class="n" x="231" y="102" text-anchor="middle">2</text>
    <text class="label" x="248" y="102">backup branch</text>
    <text class="sub" x="227" y="126">your work is copied</text>
    <text class="sub" x="227" y="142">before anything moves</text>
  </g>

  <g class="s3">
    <rect class="step" x="392" y="78" width="157" height="80" rx="8"/>
    <circle cx="412" cy="98" r="8.5" fill="#58a6ff"/><text class="n" x="412" y="102" text-anchor="middle">3</text>
    <text class="label" x="429" y="102">it tells you</text>
    <text class="sub" x="408" y="126">a notice now, and again</text>
    <text class="sub" x="408" y="142">daily while it is ignored</text>
  </g>

  <g class="s4">
    <rect class="step" x="573" y="78" width="157" height="80" rx="8"/>
    <circle class="halt" cx="593" cy="98" r="8.5" fill="#f85149"/><text class="n" x="593" y="102" text-anchor="middle">4</text>
    <text class="label" x="610" y="102">syncing stops</text>
    <text class="sub" x="589" y="126">no commit, no push,</text>
    <text class="sub" x="589" y="142">until you say what to do</text>
  </g>

  <text class="sub" x="380" y="198" text-anchor="middle">the markers are already in your files — edit them, then:</text>
  <text x="380" y="222" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="14" fill="#3fb950">syn resolve my-repo</text>
</svg>
