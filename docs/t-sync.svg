<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 371" width="760" height="371" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="pull, push and sync, with a dry run first">
  <title>syncing by hand</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13.5px }
    /* Visible by default; the keyframes do the hiding. A renderer that does
       not animate then shows the finished screen, not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,13.1%{opacity:0} 14.1%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,17.7%{opacity:0} 18.7%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,22.3%{opacity:0} 23.3%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,26.9%{opacity:0} 27.9%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,29.2%{opacity:0} 30.2%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,40.3%{opacity:0} 41.3%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,44.9%{opacity:0} 45.9%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,49.5%{opacity:0} 50.5%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,54.2%{opacity:0} 55.2%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,58.8%{opacity:0} 59.8%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,63.4%{opacity:0} 64.4%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,68.0%{opacity:0} 69.0%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,70.3%{opacity:0} 71.3%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,81.4%{opacity:0} 82.4%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="371" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="370" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">syncing by hand</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn sync my-notes --dry-run</tspan></text>
    <text class="line l1" x="22" y="81" fill="#8b949e">my-notes</text>
    <text class="line l2" x="22" y="100" fill="#8b949e">  would pull 2 commits from origin/main</text>
    <text class="line l3" x="22" y="119" fill="#8b949e">  would commit 3 files and push them</text>
    <text class="line l4" x="22" y="138"> </text>
    <text class="line l5" x="22" y="157"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn sync my-notes</tspan></text>
    <text class="line l6" x="22" y="176" fill="#58a6ff">my-notes: pulled 2 commits from origin/main</text>
    <text class="line l7" x="22" y="195" fill="#8b949e">           down  a91f3c2  notes from the laptop</text>
    <text class="line l8" x="22" y="214" fill="#8b949e">                 modified  todo.md</text>
    <text class="line l9" x="22" y="233" fill="#58a6ff">my-notes: committed local changes, pushed 1 commit</text>
    <text class="line l10" x="22" y="252" fill="#8b949e">                 modified  journal.md</text>
    <text class="line l11" x="22" y="271" fill="#8b949e">                 new       ideas.md</text>
    <text class="line l12" x="22" y="290"> </text>
    <text class="line l13" x="22" y="309"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn diff my-notes</tspan></text>
    <text class="line l14" x="22" y="328" fill="#3fb950">  nothing uncommitted - everything is published</text>
  </g>
</svg>
