<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" role="img" aria-label="JSON output, the porcelain form, and exit codes that mean something">
  <title>for scripts</title>

  <style>
    .bg     { fill: #0d1117 }
    .chrome { fill: #161b22 }
    .edge   { fill: none; stroke: #30363d; stroke-width: 1 }
    text    { font-size: 13.5px }
    /* Visible by default; the keyframes do the hiding. A renderer that does
       not animate then shows the finished screen, not an empty box. */
    .line   { opacity: 1 }
    .l0 { animation: k0 16s linear infinite }
    @keyframes k0 { 0%,2.0%{opacity:0} 3.0%,95%{opacity:1} 100%{opacity:0} }
    .l1 { animation: k1 16s linear infinite }
    @keyframes k1 { 0%,12.2%{opacity:0} 13.2%,95%{opacity:1} 100%{opacity:0} }
    .l2 { animation: k2 16s linear infinite }
    @keyframes k2 { 0%,16.5%{opacity:0} 17.5%,95%{opacity:1} 100%{opacity:0} }
    .l3 { animation: k3 16s linear infinite }
    @keyframes k3 { 0%,20.8%{opacity:0} 21.8%,95%{opacity:1} 100%{opacity:0} }
    .l4 { animation: k4 16s linear infinite }
    @keyframes k4 { 0%,22.9%{opacity:0} 23.9%,95%{opacity:1} 100%{opacity:0} }
    .l5 { animation: k5 16s linear infinite }
    @keyframes k5 { 0%,33.1%{opacity:0} 34.1%,95%{opacity:1} 100%{opacity:0} }
    .l6 { animation: k6 16s linear infinite }
    @keyframes k6 { 0%,37.4%{opacity:0} 38.4%,95%{opacity:1} 100%{opacity:0} }
    .l7 { animation: k7 16s linear infinite }
    @keyframes k7 { 0%,41.7%{opacity:0} 42.7%,95%{opacity:1} 100%{opacity:0} }
    .l8 { animation: k8 16s linear infinite }
    @keyframes k8 { 0%,45.9%{opacity:0} 46.9%,95%{opacity:1} 100%{opacity:0} }
    .l9 { animation: k9 16s linear infinite }
    @keyframes k9 { 0%,50.2%{opacity:0} 51.2%,95%{opacity:1} 100%{opacity:0} }
    .l10 { animation: k10 16s linear infinite }
    @keyframes k10 { 0%,54.4%{opacity:0} 55.4%,95%{opacity:1} 100%{opacity:0} }
    .l11 { animation: k11 16s linear infinite }
    @keyframes k11 { 0%,58.7%{opacity:0} 59.7%,95%{opacity:1} 100%{opacity:0} }
    .l12 { animation: k12 16s linear infinite }
    @keyframes k12 { 0%,60.8%{opacity:0} 61.8%,95%{opacity:1} 100%{opacity:0} }
    .l13 { animation: k13 16s linear infinite }
    @keyframes k13 { 0%,71.1%{opacity:0} 72.1%,95%{opacity:1} 100%{opacity:0} }
    .l14 { animation: k14 16s linear infinite }
    @keyframes k14 { 0%,75.3%{opacity:0} 76.3%,95%{opacity:1} 100%{opacity:0} }
    .l15 { animation: k15 16s linear infinite }
    @keyframes k15 { 0%,79.6%{opacity:0} 80.6%,95%{opacity:1} 100%{opacity:0} }
    .l16 { animation: k16 16s linear infinite }
    @keyframes k16 { 0%,81.7%{opacity:0} 82.7%,95%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1 }
    }
  </style>

  <rect class="bg" width="760" height="409" rx="10"/>
  <rect class="chrome" width="760" height="32" rx="10"/>
  <rect class="chrome" y="22" width="760" height="10"/>
  <rect class="edge" x="0.5" y="0.5" width="759" height="408" rx="10"/>

  <circle cx="19" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="37" cy="16" r="5" fill="#febc2e"/>
  <circle cx="55" cy="16" r="5" fill="#28c840"/>
  <text x="380" y="21" text-anchor="middle" fill="#8b949e" font-size="12">for scripts</text>

  <g>
    <text class="line l0" x="22" y="62"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn status all --porcelain</tspan></text>
    <text class="line l1" x="22" y="81" fill="#c9d1d9">my-notes  ok        0  0  0  main  /home/me/notes</text>
    <text class="line l2" x="22" y="100" fill="#c9d1d9">my-bot    conflict  0  2  1  main  /srv/my-bot</text>
    <text class="line l3" x="22" y="119"> </text>
    <text class="line l4" x="22" y="138"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn status all --json | jq '.[] | select(.conflict)'</tspan></text>
    <text class="line l5" x="22" y="157" fill="#c9d1d9">{</text>
    <text class="line l6" x="22" y="176" fill="#c9d1d9">  "name": "my-bot",</text>
    <text class="line l7" x="22" y="195" fill="#c9d1d9">  "branch": "main",</text>
    <text class="line l8" x="22" y="214" fill="#c9d1d9">  "behind": 2,</text>
    <text class="line l9" x="22" y="233" fill="#c9d1d9">  "conflict": "local commits conflict with the remote"</text>
    <text class="line l10" x="22" y="252" fill="#c9d1d9">}</text>
    <text class="line l11" x="22" y="271"> </text>
    <text class="line l12" x="22" y="290"><tspan fill="#a371f7" font-weight="700">$</tspan><tspan fill="#c9d1d9" dx="8">syn status all &gt; state.json || notify "syn needs attention"</tspan></text>
    <text class="line l13" x="22" y="309" fill="#f85149">  my-bot has a conflict open - run `syn resolve`</text>
    <text class="line l14" x="22" y="328" fill="#d29922">  exit 1</text>
    <text class="line l15" x="22" y="347"> </text>
    <text class="line l16" x="22" y="366" fill="#8b949e">ahead or behind is not a failure - that is the normal state</text>
  </g>
</svg>
