name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: syn-windows-amd64.zip
            binary: syn.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset_name: syn-macos-amd64.tar.gz
            binary: syn
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: syn-macos-arm64.tar.gz
            binary: syn
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: syn-linux-amd64.tar.gz
            binary: syn

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libayatana-appindicator3-dev gcc

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o ${{ matrix.binary }} ./cmd/syn/

      - name: Build installer (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          New-Item -ItemType Directory -Force -Path bin, dist | Out-Null
          Copy-Item syn.exe bin\syn.exe
          Push-Location installer
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "-DAPPVERSION=$ver" syn.nsi
          Pop-Location
          Copy-Item dist\syn-setup.exe syn-setup.exe

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: tar czf ${{ matrix.asset_name }} ${{ matrix.binary }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.goos == 'windows' && 'syn-setup.exe' || '' }}
          generate_release_notes: true
