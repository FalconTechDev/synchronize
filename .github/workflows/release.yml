name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be rebuilt without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v1.3.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    env:
      # A manual run names the tag to build; a tag push builds the tag that was pushed.
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: syn-windows-amd64.zip
            binary: syn.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset_name: syn-macos-amd64.tar.gz
            binary: syn
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: syn-macos-arm64.tar.gz
            binary: syn
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: syn-linux-amd64.tar.gz
            binary: syn

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install NSIS (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libayatana-appindicator3-dev gcc

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -X main.Version=${{ env.TAG }}" -o ${{ matrix.binary }} ./cmd/syn/

      - name: Build installer (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          # The same script people run locally, so the two cannot drift apart.
          ./packaging/windows/build.ps1 -Version ("${{ env.TAG }}" -replace '^v','')
          Copy-Item dist\syn-setup.exe syn-setup.exe

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.asset_name }}
        shell: pwsh

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          # Ship the installer beside the binary so people are not left to
          # work out where to put it.
          cp packaging/unix/install.sh .
          chmod +x install.sh ${{ matrix.binary }}
          tar czf ${{ matrix.asset_name }} ${{ matrix.binary }} install.sh

      # A binary people download and run should be checkable against
      # something, even without a signing certificate.
      - name: Checksums
        shell: bash
        run: |
          for f in ${{ matrix.asset_name }} syn-setup.exe; do
            [ -f "$f" ] && sha256sum "$f" >> checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          done
          cat checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ matrix.asset_name }}
            checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt
            ${{ matrix.goos == 'windows' && 'syn-setup.exe' || '' }}
          generate_release_notes: true
