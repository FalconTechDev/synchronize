name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # So a run can be started by hand, which is also the only way to find
  # out whether Actions is working at all on a freshly created repository.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # syn is platform-specific in several places - autostart, the shutdown
      # blocker, hiding the console - and none of that compiled outside a
      # release before this ran on every push.
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Smoke test the binary
        shell: bash
        run: |
          go build -o syn ./cmd/syn/
          ./syn version
          ./syn help > /dev/null
          ./syn doctor || true   # reports problems by design; must not crash

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install deps for cgo
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m
